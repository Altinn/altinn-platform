name: VPN Access Request
description: Request VPN and ACL access (Headscale / Tailscale)
title: "[VPN Access] Your Name"
labels:
  - area/access-mgmt
  - kind/toil
  - status/triage

body:
  - type: markdown
    attributes:
      value: |
        ## VPN Access Request

        See the [VPN Altinn Cloud User Guide](https://digdir.atlassian.net/wiki/x/aoDN7w) for setup instructions.

        > [!IMPORTANT]
        > VPN access gives **network access only**: a network path to the services. It does not give access to the services, resources or data themselves. You still need your own access to each service (for example a database user, a Key Vault role or a Kubernetes role), which you request from the team that owns the service.

        Access normally follows your team: you are added to your team's VPN group for the requested environments.
        First check [VPN-Exposed Services](https://digdir.atlassian.net/wiki/spaces/DIS/pages/4034527234/VPN-Exposed+Services+Altinn+Cloud). If the services you need are listed there, your team's group covers them, and you do not need to list them below.
        We are most interested in services that are **not yet** reachable over the VPN.

        Access requires documented approval from:
        - Product Owner
        - Team Lead
        - Team Architect

        **It is your responsibility to get the approver to confirm the approval in a comment on this issue.** Admins do not contact the approver, and the request waits until the approval is in the issue.

        Do not grant access before the approver has confirmed in a comment on this issue.

  - type: textarea
    id: setup_guide
    attributes:
      label: Setup guide
      value: See the [VPN Altinn Cloud User Guide](https://digdir.atlassian.net/wiki/x/aoDN7w) for setup instructions.

  - type: input
    id: full_name
    attributes:
      label: Full name
      placeholder: John Doe
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Digdir email
      description: Your @digdir.no address. VPN access is granted only to @digdir.no accounts, not to aas-* admin accounts.
      placeholder: first.last@digdir.no
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Team
      placeholder: e.g. Team Core
    validations:
      required: true

  - type: textarea
    id: requested_access
    attributes:
      label: Services not yet reachable over the VPN
      description: |
        Only services that are not on [VPN-Exposed Services](https://digdir.atlassian.net/wiki/spaces/DIS/pages/4034527234/VPN-Exposed+Services+Altinn+Cloud). Leave empty if your team's access covers what you need.
        For each entry, include the product/area and the service type so admins can locate it in the infrastructure.
        Service types: keyvault, storage, database, vm, kubernetes
      placeholder: |
        - Product A – database (server: foo-db)
        - Product B – keyvault (vault: bar-kv)
    validations:
      required: false

  - type: dropdown
    id: environments
    attributes:
      label: Environments
      options:
        - test
        - prod
        - test and prod
    validations:
      required: true

  - type: input
    id: approver
    attributes:
      label: Approver (Product Owner / Team Lead / Architect)
      description: Name and role of the approving person. Ask them to confirm the approval in a comment on this issue.
      placeholder: Jane Smith, Product Owner
    validations:
      required: true

  - type: textarea
    id: admin_checklist
    attributes:
      label: For Admins
      description: Do not edit. Checklist for admins processing this request.
      value: |
        - [ ] Approver has confirmed this issue
        - [ ] PR granting VPN login and access
        - [ ] PR merged and applied (live within about 15 minutes)
        - [ ] status/triage label updated as appropriate
        - [ ] Comment confirming completion, with a link to the PR
