name: Scan/Release Flux Dispatch Image and Build Kustomize OCI Artifact

env:
  FLUX_ARTIFACT_NAME: dis/kustomize/flux-dispatch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/flux-dispatch-release.yml
      - services/flux-dispatch/**
      - .github/workflows/reusable-image-scan-and-release-ghcr.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/flux-dispatch-release.yml
      - services/flux-dispatch/**
      - .github/workflows/reusable-image-scan-and-release-ghcr.yml
    tags:
      - "flux-dispatch-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-release-image:
    name: Build, scan and release
    uses: ./.github/workflows/reusable-image-scan-and-release-ghcr.yml
    with:
      release_latest: true
      image_name: flux-dispatch
      tag_prefix: flux-dispatch-v
      platforms: "linux/amd64"
      workdir: ./services/flux-dispatch
  build-release-flux-oci-latest:
    name: Build latest from main
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./services/flux-dispatch/config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Push latest flux oci image from main
        uses: ./actions/flux/build-push-image
        with:
          workdir: ./services/flux-dispatch/config
          image_name: ${{ env.FLUX_ARTIFACT_NAME }}
          tag: latest
          azure_subscription_id: ${{ secrets.AZURE_ALTINNACR_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.AZURE_ALTINNACR_APP_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  build-release-flux-oci-release:
    name: Build release from tag
    if: startsWith(github.ref, 'refs/tags/flux-dispatch-v')
    environment: flux-release
    defaults:
      run:
        working-directory: ./services/flux-dispatch/config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup vars
        id: vars
        run: |
          tag=${GITHUB_REF/refs\/tags\/flux-dispatch-/}
          echo "tag=${tag}" >> ${GITHUB_OUTPUT}
      - name: Push flux oci image from release tag
        uses: ./actions/flux/build-push-image
        with:
          workdir: ./services/flux-dispatch/config
          image_name: ${{ env.FLUX_ARTIFACT_NAME }}
          tag: ${{ steps.vars.outputs.tag }}
          azure_subscription_id: ${{ secrets.AZURE_ALTINNACR_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.AZURE_ALTINNACR_APP_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
