name: Dis Console UI Lint and Test

on:
  push:
    branches:
      - main
    paths:
      - services/dis-console-ui/**
      - .github/workflows/dis-console-ui-lint-test.yml
  pull_request:
    branches:
      - main
    paths:
      - services/dis-console-ui/**
      - .github/workflows/dis-console-ui-lint-test.yml

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dis-console-ui
    steps:
      - name: Clone the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: Run e2e on Kind
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/dis-console-ui
    env:
      CONTAINER_TOOL: docker
    steps:
      - name: Clone the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: dis-console-ui-test-e2e

      # KIND_KUBECONFIG= (empty) makes the Makefile use the ambient kubeconfig
      # from kind-action; its default is a dedicated file so local runs never
      # touch the developer's current context.
      - name: Build image, deploy to Kind, smoke-test
        run: make e2e KIND_KUBECONFIG=
