name: Terraform Actions Test

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/terraform-actions-test.yml
      - actions/terraform/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

env:
  ENVIRONMENT: test
  TF_PROJECT: ./actions/terraform/test
  TF_STORAGE_ACCOUNT: altinnterraformstorage02
  ARM_CLIENT_ID: ${{ secrets.TF_AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: 1ce8e9af-c2d6-44e7-9c5e-099a308056fe
  ARM_TENANT_ID: cd0026d8-283b-4a55-9bfa-d0ef4a8ba21c

permissions:
  contents: read

jobs:
  plan:
    name: Plan (${{ matrix.runner }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: reader
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [self-hosted, ubuntu-latest]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Terraform Plan
        uses: ./actions/terraform/plan
        env:
          TF_VAR_run_id: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          working_directory: ${{ env.TF_PROJECT }}
          oidc_type: environment
          oidc_value: ${{ env.ENVIRONMENT }}
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_subscription_id: ${{ env.ARM_SUBSCRIPTION_ID }}
          tf_arm_storage_account_name: ${{ env.TF_STORAGE_ACCOUNT }}
          tf_state_name: actions-terraform-test-${{ matrix.runner }}.tfstate
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          store_plan_on_pull_request: "true"

      - name: Check that the plan file is stored
        shell: bash
        run: |
          blob="${TF_STATE_FILE}.plans/${GITHUB_RUN_ID}.tfplan"
          stored=$(az storage blob list --auth-mode login --account-name "$TF_STORAGE_ACCOUNT" --container-name tfstates --prefix "$blob" --query "length(@)" --output tsv)
          if [ "$stored" != 1 ]; then
            echo "::error::The plan file $blob is not in the storage account."
            exit 1
          fi

  apply:
    name: Apply (${{ matrix.runner }})
    needs: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [self-hosted, ubuntu-latest]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Terraform Apply
        uses: ./actions/terraform/apply
        with:
          working_directory: ${{ env.TF_PROJECT }}
          oidc_type: environment
          oidc_value: ${{ env.ENVIRONMENT }}
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_subscription_id: ${{ env.ARM_SUBSCRIPTION_ID }}
          tf_arm_storage_account_name: ${{ env.TF_STORAGE_ACCOUNT }}
          tf_state_name: actions-terraform-test-${{ matrix.runner }}.tfstate

      - name: Check that no version of the plan file is left
        shell: bash
        run: |
          blob="${TF_STATE_FILE}.plans/${GITHUB_RUN_ID}.tfplan"
          left=$(az storage blob list --auth-mode login --account-name "$TF_STORAGE_ACCOUNT" --container-name tfstates --prefix "$blob" --include v --query "length(@)" --output tsv)
          if [ "$left" != 0 ]; then
            echo "::error::$left version(s) of the plan file $blob are left."
            exit 1
          fi

  refuse-log-level:
    name: Refuse log level (${{ matrix.runner }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [self-hosted, ubuntu-latest]
    env:
      TF_LOG_CORE: TRACE
      TF_LOG_PROVIDER: İNFO
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Terraform Init with refused log levels
        id: init
        continue-on-error: true
        uses: ./actions/terraform/init
        with:
          working_directory: ${{ env.TF_PROJECT }}
          oidc_type: environment
          oidc_value: ${{ env.ENVIRONMENT }}
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_subscription_id: ${{ env.ARM_SUBSCRIPTION_ID }}
          tf_state_name: actions-terraform-test-refused.tfstate
          tf_log_level: debug

      - name: Check that init refused the log levels
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.init.outcome }}
          INIT_STEP_OUTCOME: ${{ steps.init.outputs.init_step_outcome }}
        run: |
          failed=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', want '$3'."
              failed=1
            fi
          }
          check "The init action" "$ACTION_OUTCOME" failure
          check "The terraform init step" "$INIT_STEP_OUTCOME" skipped
          check TF_LOG "$TF_LOG" WARN
          check TF_LOG_CORE "$TF_LOG_CORE" WARN
          check TF_LOG_PROVIDER "$TF_LOG_PROVIDER" WARN
          exit "$failed"

  delete-plan-file:
    name: Delete plan file with a stub (${{ matrix.runner }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [self-hosted, ubuntu-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test the delete of the plan file
        shell: bash
        run: bash actions/terraform/test/plan-file-delete-test.sh
