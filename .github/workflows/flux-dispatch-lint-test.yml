name: Flux Dispatch Lint and Test

on:
  push:
    branches:
      - main
    paths:
      - services/flux-dispatch/**
      - .github/workflows/flux-dispatch-lint-test.yml
      - Makefile.common
  pull_request:
    branches:
      - main
    paths:
      - services/flux-dispatch/**
      - .github/workflows/flux-dispatch-lint-test.yml
      - Makefile.common

permissions:
  contents: read

jobs:
  lint:
    name: Run linter on Ubuntu
    runs-on: self-hosted
    defaults:
      run:
        working-directory: services/flux-dispatch
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "services/flux-dispatch/go.mod"
          cache-dependency-path: "services/flux-dispatch/go.sum"

      - name: Run linter
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: services/flux-dispatch
          args: ./cmd/... ./internal/... ./manifests/...
  test:
    name: Run tests on Ubuntu
    runs-on: self-hosted
    defaults:
      run:
        working-directory: services/flux-dispatch
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "services/flux-dispatch/go.mod"
          cache-dependency-path: "services/flux-dispatch/go.sum"

      - name: Verify generated manifests
        run: make cdk8s-manifests-verify

      - name: Running Tests
        run: |
          go mod tidy
          make verify
