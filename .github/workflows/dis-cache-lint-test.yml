name: Dis Cache Lint and Test

on:
  push:
    branches:
      - main
    paths:
      - services/dis-cache-operator/**
      - .github/workflows/dis-cache-lint-test.yml
      - Makefile.common
  pull_request:
    branches:
      - main
    paths:
      - services/dis-cache-operator/**
      - .github/workflows/dis-cache-lint-test.yml
      - Makefile.common

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Run linter on Ubuntu
    runs-on: self-hosted
    defaults:
      run:
        working-directory: services/dis-cache-operator
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "services/dis-cache-operator/go.mod"
          cache-dependency-path: "services/dis-cache-operator/go.sum"

      - name: Run linter
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: services/dis-cache-operator
  test:
    name: Run tests on Ubuntu
    runs-on: self-hosted
    defaults:
      run:
        working-directory: services/dis-cache-operator
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "services/dis-cache-operator/go.mod"
          cache-dependency-path: "services/dis-cache-operator/go.sum"

      - name: Running Tests
        run: |
          go mod tidy
          make test
