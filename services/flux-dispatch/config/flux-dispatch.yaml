apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    azure.workload.identity/client-id: ${FLUX_DISPATCH_WORKLOAD_IDENTITY_CLIENT_ID}
  labels:
    app: flux-dispatch
    owner: platform
  name: flux-dispatch
  namespace: dis-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    dis.altinn.cloud/scaling-note: "replicas is pinned to 1: the dedup tracker (RFC 0010 Deduplication) lives in this pod's own memory. A second replica has a disjoint dedup map, so the same Flux reconcile event (or a notification-controller retry) delivered to both pods dispatches twice — duplicate GitHub Actions runs for one deploy, the exact failure mode this service exists to prevent. Do not scale horizontally without first moving dedup to shared storage."
  labels:
    app: flux-dispatch
    owner: platform
  name: flux-dispatch
  namespace: dis-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-dispatch
      owner: platform
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app: flux-dispatch
        owner: platform
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: LISTEN_ADDR
              value: :8080
            - name: METRICS_ADDR
              value: :9090
            - name: DRY_RUN
              value: ${DRY_RUN}
            - name: GITHUB_APP_ID
              value: ${GITHUB_APP_ID}
            - name: GITHUB_INSTALLATION_ID
              value: ${GITHUB_INSTALLATION_ID}
            - name: GITHUB_PRIVATE_KEY_PATH
              value: /etc/flux-dispatch/secrets/github-app/private-key.pem
          image: flux-dispatch:latest
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
          name: flux-dispatch
          ports:
            - containerPort: 8080
              name: webhook
            - containerPort: 9090
              name: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: webhook
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/flux-dispatch/secrets/github-app
              name: github-app-key
              readOnly: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: flux-dispatch
      volumes:
        - name: github-app-key
          secret:
            optional: true
            secretName: flux-dispatch-github-app-key
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: flux-dispatch
    owner: platform
  name: flux-dispatch
  namespace: dis-platform
spec:
  ports:
    - name: webhook
      port: 8080
      protocol: TCP
      targetPort: webhook
  selector:
    app: flux-dispatch
    owner: platform
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-dispatch-allow-webhook-traffic
  namespace: dis-platform
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app: flux-dispatch
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-dispatch-allow-metrics-traffic
  namespace: dis-platform
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
  podSelector:
    matchLabels:
      app: flux-dispatch
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-dispatch-allow-egress
  namespace: dis-platform
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - ports:
        - port: 443
          protocol: TCP
  podSelector:
    matchLabels:
      app: flux-dispatch
  policyTypes:
    - Egress
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app: flux-dispatch
    owner: platform
  name: flux-dispatch
  namespace: dis-platform
spec:
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - interval: 30s
      path: /metrics
      port: metrics
  selector:
    matchLabels:
      app: flux-dispatch
      owner: platform
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  labels:
    app: flux-dispatch
    owner: platform
  name: flux-dispatch-kv-store
  namespace: dis-platform
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      serviceAccountRef:
        name: flux-dispatch
        namespace: dis-platform
      vaultUrl: ${KV_URI}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app: flux-dispatch
    owner: platform
  name: flux-dispatch-github-app-key-external-secret
  namespace: dis-platform
spec:
  data:
    - remoteRef:
        key: ${KV_SECRET_NAME_GITHUB_APP_KEY}
      secretKey: private-key.pem
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: flux-dispatch-kv-store
  target:
    creationPolicy: Owner
    name: flux-dispatch-github-app-key
