---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - cache.dis.altinn.cloud
  resources:
  - caches
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cache.dis.altinn.cloud
  resources:
  - caches/finalizers
  verbs:
  - update
- apiGroups:
  - cache.dis.altinn.cloud
  resources:
  - caches/status
  verbs:
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - list
  - patch
  - watch
- apiGroups:
  - policy.linkerd.io
  resources:
  - authorizationpolicies
  - meshtlsauthentications
  - servers
  verbs:
  - create
  - list
  - patch
  - watch
- apiGroups:
  - valkey.io
  resources:
  - valkeyclusters
  verbs:
  - create
  - list
  - patch
  - watch
