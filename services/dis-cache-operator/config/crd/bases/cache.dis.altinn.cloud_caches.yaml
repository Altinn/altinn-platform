---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: caches.cache.dis.altinn.cloud
spec:
  group: cache.dis.altinn.cloud
  names:
    kind: Cache
    listKind: CacheList
    plural: caches
    singular: cache
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.host
      name: Host
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cache is the Schema for the caches API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of Cache.
            properties:
              evictionPolicy:
                default: noeviction
                description: EvictionPolicy selects the Valkey maxmemory-policy. Defaults
                  to noeviction.
                enum:
                - noeviction
                - allkeys-lru
                - allkeys-lfu
                - allkeys-random
                - volatile-lru
                - volatile-lfu
                - volatile-random
                - volatile-ttl
                type: string
              passwordRotation:
                default: {}
                description: |-
                  PasswordRotation controls the password rotation of this Cache. The
                  defaults apply when the field is not set.
                properties:
                  intervalDays:
                    default: 0
                    description: |-
                      IntervalDays rotates the password on a schedule, every IntervalDays
                      days after the last rotation. 0 turns the schedule off. The platform
                      default is 0 until applications on the platform reload the password
                      without a restart. The target default is 90.
                    format: int32
                    maximum: 365
                    minimum: 0
                    type: integer
                  previousValidFor:
                    description: |-
                      PreviousValidFor is how long the previous password stays valid after a
                      rotation. Zero removes it at once, for a password that may have leaked.
                      A removed password does not end open connections. An operator flag sets
                      the default, 7 days on the platform. The maximum is 168h.
                    type: string
                  requestedAt:
                    description: |-
                      RequestedAt asks for one rotation. A value later than
                      status.passwordRotation.requestedAt starts it. The operator does not
                      wait for this time. A value in the future starts the rotation now. The
                      operator carries out a request made while a previous password is still
                      valid when that period ends.
                    format: date-time
                    type: string
                type: object
                x-kubernetes-validations:
                - message: intervalDays is 0 (off) or at least 7
                  rule: '!has(self.intervalDays) || self.intervalDays == 0 || self.intervalDays
                    >= 7'
                - message: previousValidFor is at most 168h (7 days)
                  rule: '!has(self.previousValidFor) || duration(self.previousValidFor)
                    <= duration(''168h'')'
                - message: previousValidFor is at most half of the interval
                  rule: '!has(self.previousValidFor) || !has(self.intervalDays) ||
                    self.intervalDays == 0 || duration(self.previousValidFor).getSeconds()
                    <= self.intervalDays * 43200'
              persistence:
                description: |-
                  Persistence keeps cache data on disk. Off by default: a cache does not
                  keep data.
                type: boolean
              size:
                default: small
                description: |-
                  Size selects the capacity tier. The platform maps each size to CPU,
                  memory, and replica values.
                enum:
                - small
                - medium
                - large
                type: string
            type: object
          status:
            description: Status defines the observed state of Cache.
            properties:
              conditions:
                description: Conditions represent the current state of this Cache.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              host:
                description: Host is the in-cluster DNS name of the Valkey service.
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest generation reconciled
                  by the controller.
                format: int64
                type: integer
              passwordRotation:
                description: PasswordRotation records the last password rotation.
                properties:
                  lastRotatedAt:
                    description: |-
                      LastRotatedAt is the time of the last rotation. The schedule counts
                      from this time.
                    format: date-time
                    type: string
                  previousValidUntil:
                    description: |-
                      PreviousValidUntil is the time when the previous password stops being
                      valid. It is unset when no previous password exists.
                    format: date-time
                    type: string
                  requestedAt:
                    description: |-
                      RequestedAt is the spec.passwordRotation.requestedAt value of the last
                      request the operator carried out. A request with a later value starts
                      the next rotation.
                    format: date-time
                    type: string
                type: object
              port:
                description: Port is the Valkey port.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be at most 56 characters: the Valkey Service
            is named valkey-<name> and a Service name has at most 63 characters'
          rule: size(self.metadata.name) <= 56
        - message: 'metadata.name must not contain a dot: the Valkey Service is named
            valkey-<name> and a Service name is a single DNS label'
          rule: '!self.metadata.name.contains(''.'')'
    served: true
    storage: true
    subresources:
      status: {}
