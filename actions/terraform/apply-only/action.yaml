name: Terraform Plan
description: Run terraform plan
inputs:
  working_directory:
    description: The directory where the Terraform project is located.
    default: ./infrastructure
    required: true

  arm_client_id:
    required: true
    description: Federated Azure Client ID.
  arm_subscription_id:
    required: true
    description: Azure Subscription ID
  arm_tenant_id:
    description: Azure Tenant ID
    default: cd0026d8-283b-4a55-9bfa-d0ef4a8ba21c

  tf_arm_storage_account_name:
    description: Name of the azure storage account that persists the terraform state
    default: altinnterraformstorage02
  tf_args:
    description: Terraform arguments
    required: false
  tf_output_file:
    description: JSON file for dumping tf state output
    default: tf_output.json

runs:
  using: composite
  steps:
    - name: Artifact Key
      id: artifact_key
      shell: bash
      env:
        TERRAFORM_STATE_FILE: ${{ env.TF_STATE_FILE }}
      run: |
        TF_STATE_FILE=$TERRAFORM_STATE_FILE
        ARTIFACT_KEY="${TF_STATE_FILE////_}.tfplan"
        echo "ARTIFACT_KEY=$ARTIFACT_KEY" >> $GITHUB_ENV

    - name: Download Plan Checksum
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ env.ARTIFACT_KEY }}.sha256
        path: ${{ runner.temp }}/${{ env.ARTIFACT_KEY }}.sha256

    - name: Azure Login for Plan File
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
      env:
        AZURE_CONFIG_DIR: ${{ runner.temp }}/terraform-plan-file-azure
      with:
        client-id: ${{ inputs.arm_client_id }}
        tenant-id: ${{ inputs.arm_tenant_id }}
        allow-no-subscriptions: true

    - name: Download Plan File
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        AZURE_CONFIG_DIR: ${{ runner.temp }}/terraform-plan-file-azure
        STORAGE_ACCOUNT: ${{ inputs.tf_arm_storage_account_name }}
        CHECKSUM_FILE: ${{ runner.temp }}/${{ env.ARTIFACT_KEY }}.sha256/tfplan.sha256
      run: bash "$GITHUB_ACTION_PATH/../plan-file.sh" fetch

    - name: Terraform Apply
      id: apply
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        terraform apply -input=false -auto-approve $TERRAFORM_ARGS tfplan.out
        terraform output -json >> $TERRAFORM_OUTPUT_FILE
      env:
        ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.arm_subscription_id }}
        ARM_TENANT_ID: ${{ inputs.arm_tenant_id }}
        ARM_USE_OIDC: "true"
        TERRAFORM_OUTPUT_FILE: ${{ inputs.tf_output_file }}
        TERRAFORM_ARGS: ${{ inputs.tf_args }}

    - name: Delete Plan File
      shell: bash
      env:
        AZURE_CONFIG_DIR: ${{ runner.temp }}/terraform-plan-file-azure
        STORAGE_ACCOUNT: ${{ inputs.tf_arm_storage_account_name }}
      run: bash "$GITHUB_ACTION_PATH/../plan-file.sh" delete
