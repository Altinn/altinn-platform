name: Terraform Plan
description: Run terraform plan
inputs:
  working_directory:
    description: The directory where the Terraform project is located.
    default: ./infrastructure
    required: true

  oidc_type:
    description: Specifies a part of subject for OpenID Connect (OIDC), can be values 'branch' or 'environment'
    required: true
  oidc_value:
    description: Name of branch or environment
    required: true

  arm_client_id:
    required: true
    description: Federated Azure Client ID.
  arm_subscription_id:
    required: true
    description: Azure Subscription ID
  arm_tenant_id:
    description: Azure Tenant ID
    default: cd0026d8-283b-4a55-9bfa-d0ef4a8ba21c

  tf_arm_subscription_id:
    required: true
    default: d43d5057-8389-40d5-88c4-04db9275cbf2
    description: Azure Subscription ID for the storage account that persists the terraform state
  tf_arm_resource_group_name:
    description: Azure resource group for the storage account that persists the terraform state
    default: terraform-rg
  tf_arm_storage_account_name:
    description: Name of the azure storage account that persists the terraform state
    default: altinnterraformstorage02
  tf_state_name:
    description: Name of Terraform state file
    required: true
    default: tfstate
  tf_version:
    description: Terraform Version
  tf_log_level:
    description: Terraform log level. Allowed values are INFO, WARN and ERROR. The action fails on every other value, because the job log can be public and levels such as DEBUG and TRACE can print secret values.
    default: WARN
  tf_args:
    description: Terraform arguments
    required: false
  store_plan_on_pull_request:
    description: Set to 'true' to store the plan file on pull request runs. Only needed when a job applies the plan in the same pull request run.
    required: false
    default: "false"

  gh_token:
    description: GitHub Token
    required: true

runs:
  using: composite
  steps:
    - name: Terraform Init
      id: terraform_init
      uses: Altinn/altinn-platform/actions/terraform/init@main
      with:
        working_directory: ${{ inputs.working_directory }}

        oidc_type: ${{ inputs.oidc_type }}
        oidc_value: ${{ inputs.oidc_value }}

        arm_client_id: ${{ inputs.arm_client_id }}
        arm_subscription_id: ${{ inputs.arm_subscription_id }}
        arm_tenant_id: ${{ inputs.arm_tenant_id }}

        tf_arm_subscription_id: ${{ inputs.tf_arm_subscription_id }}
        tf_arm_resource_group_name: ${{ inputs.tf_arm_resource_group_name }}
        tf_arm_storage_account_name: ${{ inputs.tf_arm_storage_account_name }}
        tf_state_name: ${{ inputs.tf_state_name }}

        tf_version: ${{ inputs.tf_version }}
        tf_log_level: ${{ inputs.tf_log_level }}

    - name: Terraform Plan
      id: plan
      shell: bash
      if: always()
      working-directory: ${{ inputs.working_directory }}
      run: |
        terraform plan -detailed-exitcode -no-color -input=false -out tfplan.out $TERRAFORM_ARGS 2>&1 > tfplan.log  && cat tfplan.log || export EC=$?; cat tfplan.log; exit $EC
      env:
        ARM_CLIENT_ID: ${{ inputs.arm_client_id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.arm_subscription_id }}
        ARM_TENANT_ID: ${{ inputs.arm_tenant_id }}
        ARM_USE_OIDC: "true"
        TERRAFORM_ARGS: ${{ inputs.tf_args }}

    - name: Artifact Key
      id: artifact_key
      shell: bash
      env:
        TERRAFORM_STATE_FILE: ${{ env.TF_STATE_FILE }}
      run: |
        TF_STATE_FILE=$TERRAFORM_STATE_FILE
        ARTIFACT_KEY="${TF_STATE_FILE////_}.tfplan"
        echo "ARTIFACT_KEY=$ARTIFACT_KEY" >> $GITHUB_ENV

    - name: Plan File Checksum
      id: plan_file
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        STORAGE_ACCOUNT: ${{ inputs.tf_arm_storage_account_name }}
        CHECKSUM_FILE: ${{ runner.temp }}/${{ env.ARTIFACT_KEY }}.sha256/tfplan.sha256
        STORE_ON_PULL_REQUEST: ${{ inputs.store_plan_on_pull_request }}
      run: bash "$GITHUB_ACTION_PATH/../plan-file.sh" checksum

    - name: Upload Plan Checksum
      if: steps.plan_file.outputs.store == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.ARTIFACT_KEY }}.sha256
        path: ${{ runner.temp }}/${{ env.ARTIFACT_KEY }}.sha256/tfplan.sha256
        if-no-files-found: error

    - name: Azure Login for Plan File
      if: steps.plan_file.outputs.store == 'true'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
      env:
        AZURE_CONFIG_DIR: ${{ runner.temp }}/terraform-plan-file-azure
      with:
        client-id: ${{ inputs.arm_client_id }}
        tenant-id: ${{ inputs.arm_tenant_id }}
        allow-no-subscriptions: true

    - name: Store Plan File
      if: steps.plan_file.outputs.store == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        AZURE_CONFIG_DIR: ${{ runner.temp }}/terraform-plan-file-azure
        STORAGE_ACCOUNT: ${{ inputs.tf_arm_storage_account_name }}
      run: bash "$GITHUB_ACTION_PATH/../plan-file.sh" store

    - name: Write Terraform Summary
      uses: Altinn/altinn-platform/actions/terraform/write-terraform-summary@main
      with:
        working_directory: ${{ inputs.working_directory }}
        oidc_type: ${{ inputs.oidc_type }}
        oidc_value: ${{ inputs.oidc_value }}
        gh_token: ${{ inputs.gh_token }}
      env:
        VALIDATE_STEP_OUTPUT: ${{steps.terraform_init.outputs.validate_step_stdout}}
        VALIDATE_STEP_OUTCOME: ${{steps.terraform_init.outputs.validate_step_outcome}}
        FMT_STEP_OUTPUT: ${{steps.terraform_init.outputs.fmt_step_stdout}}
        FMT_STEP_OUTCOME: ${{steps.terraform_init.outputs.fmt_step_outcome}}
        INIT_STEP_OUTPUT: ${{steps.terraform_init.outputs.init_step_stdout}}
        INIT_STEP_OUTCOME: ${{steps.terraform_init.outputs.init_step_outcome}}

        PLAN_STEP_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        PLAN_STEP_OUTCOME: ${{ steps.plan.outcome }}
